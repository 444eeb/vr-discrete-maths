<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DiscreteVR — Propositional Logic</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style> body { margin: 0; } </style>
  </head>
  <body>
    <a-scene fog="type: linear; color: #0a1230; near: 18; far: 60">
      <a-sky material="shader: skygradient; topColor: #05070f; bottomColor: #12203f"></a-sky>
      <a-entity starfield="count: 550; radius: 70"></a-entity>
      <a-entity truth-field="count: 70"></a-entity>
      <a-light type="ambient" color="#9aa8d0" intensity="0.85"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.45" position="3 6 4"></a-light>
      <a-light type="point" color="#e94560" intensity="0.4" position="0 6 0" distance="30"></a-light>

      <a-plane rotation="-90 0 0" width="120" height="120" position="0 0 0"
               material="shader: flat; color: #070c1c"></a-plane>
      <a-entity geometry="primitive: plane; width: 120; height: 120; segmentsWidth: 60; segmentsHeight: 60"
                rotation="-90 0 0" position="0 0.02 0"
                material="wireframe: true; color: #21486b; shader: flat; opacity: 0.6; transparent: true"></a-entity>

      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls wasd-controls>
          <a-cursor color="#e94560" fuse="false" raycaster="objects: .clickable"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.018"
            material="color: #e94560; shader: flat"></a-cursor>
        </a-camera>
      </a-entity>

      <a-entity position="0 9.3 -12"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 42000; easing: linear">
        <a-icosahedron radius="1.1" material="wireframe: true; shader: flat; color: #4ce0b3"></a-icosahedron>
        <a-octahedron radius="0.6" material="wireframe: true; shader: flat; color: #e94560"></a-octahedron>
      </a-entity>
      <a-entity position="0 7 -12">
        <a-text value="Propositional Logic" align="center" color="white" scale="3 3 3"></a-text>
        <a-plane width="5.6" height="0.04" position="0 -0.75 0" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="DiscreteVR" align="center" position="0 -1.15 0" color="#4ce0b3" scale="0.9 0.9 0.9"></a-text>
      </a-entity>

      <a-entity position="0 0.6 -5">
        <a-plane width="1.75" height="0.62" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.25"></a-plane>
        <a-plane class="clickable" navigate-on-click="url: index.html" hover-glow
                 width="1.6" height="0.5" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Back to Hub" align="center" position="0 0 0.02" color="white" scale="1 1 1"></a-text>
      </a-entity>

      <a-entity position="-12 2.5 0" rotation="0 90 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Propositions" align="center" position="0 2.4 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <a-box width="0.6" height="0.6" depth="0.03" color="#4ecca3" position="-0.8 1.5 0.05" rotation="0 0 0"></a-box>
        <a-text value="T" align="center" position="0 1.5 0.01" color="white" scale="1.0 1.0 1.0" width="2"></a-text>
        <a-box width="0.6" height="0.6" depth="0.03" color="#e94560" position="0.8 1.5 0.05" rotation="0 0 0"></a-box>
        <a-text value="F" align="center" position="0 1.5 0.01" color="white" scale="1.0 1.0 1.0" width="2"></a-text>
        <a-text value="A proposition is a declarative\nstatement that is either\nTRUE (T) or FALSE (F)." align="center" position="0 0.3 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.6 0.01"></a-box>
        <a-text value="P: '2 + 2 = 4'   is T\nQ: '3 is even'   is F\n\nQuestions and commands\nare NOT propositions." align="center" position="0 -1.6 0.01" color="#4ecca3" scale="0.9 0.9 0.9" width="4.5"></a-text>
      </a-entity>

      <a-entity position="-9.7 2.5 -7" rotation="0 54 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Negation  ~P" align="center" position="0 2.4 0.01" color="#e94560" scale="1.4 1.4 1.4"></a-text>
        <a-text value="Reverses the truth value.\n'not P'" align="center" position="0 1.5 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="P        ~P" align="center" position="0 0.6 0.01" color="#e94560" scale="1.1 1.1 1.1" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.4 0.01"></a-box>
        <a-text value="T         F" align="center" position="0 0.0 0.01" color="white" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-text value="F         T" align="center" position="0 -0.4 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-text value="If P is true, ~P is false,\nand vice versa." align="center" position="0 -1.6 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <a-entity position="-3.7 2.5 -11.4" rotation="0 18 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Conjunction  P ^ Q" align="center" position="0 2.4 0.01" color="#e94560" scale="1.2 1.2 1.2"></a-text>
        <a-text value="Logical AND. True only\nwhen BOTH are true." align="center" position="0 1.6 0.01" color="white" scale="0.9 0.9 0.9" width="4.5"></a-text>
        <a-text value="P     Q     P^Q" align="center" position="0 0.7 0.01" color="#e94560" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.5 0.01"></a-box>
        <a-text value="T     T      T" align="center" position="0 0.1 0.01" color="#4ecca3" scale="1.0 1.0 1.0" width="4.5"></a-text>
        <a-text value="T     F      F" align="center" position="0 -0.3 0.01" color="white" scale="1.0 1.0 1.0" width="4.5"></a-text>
        <a-text value="F     T      F" align="center" position="0 -0.7 0.01" color="white" scale="1.0 1.0 1.0" width="4.5"></a-text>
        <a-text value="F     F      F" align="center" position="0 -1.1 0.01" color="white" scale="1.0 1.0 1.0" width="4.5"></a-text>
      </a-entity>

      <a-entity position="3.7 2.5 -11.4" rotation="0 -18 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Disjunction  P v Q" align="center" position="0 2.4 0.01" color="#e94560" scale="1.2 1.2 1.2"></a-text>
        <a-text value="Logical OR. True when AT\nLEAST ONE is true." align="center" position="0 1.6 0.01" color="white" scale="0.9 0.9 0.9" width="4.5"></a-text>
        <a-text value="P     Q     PvQ" align="center" position="0 0.7 0.01" color="#e94560" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.5 0.01"></a-box>
        <a-text value="T     T      T" align="center" position="0 0.1 0.01" color="#4ecca3" scale="1.0 1.0 1.0" width="4.5"></a-text>
        <a-text value="T     F      T" align="center" position="0 -0.3 0.01" color="#4ecca3" scale="1.0 1.0 1.0" width="4.5"></a-text>
        <a-text value="F     T      T" align="center" position="0 -0.7 0.01" color="#4ecca3" scale="1.0 1.0 1.0" width="4.5"></a-text>
        <a-text value="F     F      F" align="center" position="0 -1.1 0.01" color="white" scale="1.0 1.0 1.0" width="4.5"></a-text>
      </a-entity>

      <a-entity position="9.7 2.5 -7" rotation="0 -54 0">

        <a-text value="Implication  P -> Q" align="center" position="0 2.4 0.01" color="#e94560" scale="1.2 1.2 1.2"></a-text>
        <a-text value="'If P then Q.' False ONLY\nwhen P true and Q false." align="center" position="0 1.6 0.01" color="white" scale="0.9 0.9 0.9" width="4.5"></a-text>
        <a-text value="P     Q     P->Q" align="center" position="0 0.7 0.01" color="#e94560" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.5 0.01"></a-box>
        <a-text value="T     T      T" align="center" position="0 0.1 0.01" color="#4ecca3" scale="1.0 1.0 1.0" width="4.5"></a-text>

      <a-entity position="12 2.5 0" rotation="0 -90 0">

    <script>
      AFRAME.registerShader('skygradient', {
        schema: {
          topColor:    { type: 'color', default: '#05070f', is: 'uniform' },
          bottomColor: { type: 'color', default: '#12203f', is: 'uniform' }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 bottomColor;
          varying vec3 vWorldPosition;
          void main() {
            float h = normalize(vWorldPosition).y;
            gl_FragColor = vec4(mix(bottomColor, topColor, max(0.0, h)), 1.0);
          }
        `
      });

      AFRAME.registerComponent('starfield', {
        schema: { count: { default: 600 }, radius: { default: 70 } },
        init: function () {
          const geometry = new THREE.BufferGeometry();
          const positions = [];
          for (let i = 0; i < this.data.count; i++) {
            const r = this.data.radius * (0.55 + Math.random() * 0.45);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
          }
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          const material = new THREE.PointsMaterial({ color: 0xbfd0ff, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.9 });
          this.el.setObject3D('stars', new THREE.Points(geometry, material));
        }
      });


      // Drifting glyph "rain" on a surrounding cylinder (one animated texture)
      AFRAME.registerComponent('glyph-rain', {
        schema: { glyphs: { default: '0,1' }, dir: { default: 1 } },
        init: function () {
          const canvas = document.createElement('canvas');
          canvas.width = 1024; canvas.height = 1024;
          const ctx = canvas.getContext('2d');
          const glyphs = this.data.glyphs.split(',');
          const cols = 40, rows = 40, cw = canvas.width / cols, rh = canvas.height / rows;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.font = Math.floor(rh * 0.7) + 'px monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          for (let c = 0; c < cols; c++) {
            for (let r = 0; r < rows; r++) {
              const g = glyphs[Math.floor(Math.random() * glyphs.length)];
              const a = 0.12 + Math.random() * 0.5;
              ctx.fillStyle = (Math.random() < 0.12) ? 'rgba(233,69,96,' + a + ')' : 'rgba(76,224,179,' + a + ')';
              ctx.fillText(g, c * cw + cw / 2, r * rh + rh / 2);
            }
          }
          const texture = new THREE.CanvasTexture(canvas);
          texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(5, 3);
          this.texture = texture;
          const geo = new THREE.CylinderGeometry(34, 34, 48, 48, 1, true);
          const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide, transparent: true, opacity: 0.5, depthWrite: false });
          const mesh = new THREE.Mesh(geo, mat); mesh.position.y = 12;
          this.el.setObject3D('rain', mesh);
        },
        tick: function (t, dt) { if (this.texture && dt) { this.texture.offset.y += (dt / 1000) * 0.05 * this.data.dir; } }
      });


      // Drifting field of wireframe cubes flipping between true (teal) and false (coral)
      AFRAME.registerComponent('truth-field', {
        schema: { count: { default: 70 } },
        init: function () {
          this.mats = [];
          const group = new THREE.Group();
          const geo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
          for (let i = 0; i < this.data.count; i++) {
            const R = 18 + Math.random() * 18;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.6;
            const x = R * Math.sin(phi) * Math.cos(theta);
            const y = Math.abs(R * Math.cos(phi)) + 2;
            const z = R * Math.sin(phi) * Math.sin(theta);
            const mat = new THREE.MeshBasicMaterial({
              color: (Math.random() < 0.5) ? 0x4ce0b3 : 0xe94560,
              wireframe: true, transparent: true, opacity: 0.5
            });
            const cube = new THREE.Mesh(geo, mat);
            cube.position.set(x, y, z);
            cube.rotation.set(Math.random() * 3, Math.random() * 3, 0);
            group.add(cube);
            this.mats.push(mat);
          }
          this.el.setObject3D('field', group);
          this.group = group;
          this._acc = 0;
        },
        tick: function (t, dt) {
          if (!dt) return;
          this.group.rotation.y += (dt / 1000) * 0.02;
          this._acc += dt;
          if (this._acc > 400) {
            this._acc = 0;
            for (let k = 0; k < 5; k++) {
              const m = this.mats[Math.floor(Math.random() * this.mats.length)];
              m.color.set((Math.random() < 0.5) ? 0x4ce0b3 : 0xe94560);
            }
          }
        }
      });

      AFRAME.registerComponent('navigate-on-click', {
        schema: { url: { type: 'string' } },
        init: function () { this.el.addEventListener('click', () => { window.location.href = this.data.url; }); }
      });

      AFRAME.registerComponent('hover-glow', {
        init: function () {
          const el = this.el;
          const originalColor = el.getAttribute('material') ? el.getAttribute('material').color : el.getAttribute('color');
          el.addEventListener('mouseenter', () => { el.setAttribute('material', 'color', '#ff6b8a'); });
          el.addEventListener('mouseleave', () => { el.setAttribute('material', 'color', originalColor); });
        }
      });

      let currentInput = '';
      let isWaiting = false;

      AFRAME.registerComponent('keyboard-key', {
        schema: { letter: { type: 'string' } },
        init: function () {
          const el = this.el;
          const letter = this.data.letter;
          const originalColor = el.getAttribute('color');
          el.addEventListener('mouseenter', () => { el.setAttribute('color', '#ff6b8a'); });
          el.addEventListener('mouseleave', () => { el.setAttribute('color', originalColor); });
          el.addEventListener('click', () => {
            if (isWaiting) return;
            const display = document.getElementById('input-display');
            if (letter === 'SPACE') { currentInput += ' '; }
            else if (letter === 'BACK') { currentInput = currentInput.slice(0, -1); }
            else if (letter === 'CLEAR') { currentInput = ''; }
            else if (letter === 'ASK') { if (currentInput.trim() === '') return; askTutor(currentInput.trim()); return; }
            else { currentInput += letter; }
            display.setAttribute('value', currentInput || 'Gaze at letters to type...');
          });
        }
      });

      async function askTutor(question) {
        isWaiting = true;
        const response = document.getElementById('response-display');
        const display = document.getElementById('input-display');
        response.setAttribute('value', 'Thinking...');
        display.setAttribute('value', 'Q: ' + question);
        try {
          const res = await fetch('http://localhost:11434/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'phi3',
              prompt: 'You are a discrete mathematics tutor. Answer this question about propositional logic concisely in 3-4 sentences max: ' + question,
              stream: false
            })
          });
          const data = await res.json();
          response.setAttribute('value', 'Q: ' + question + '\n\n' + data.response);
        } catch (err) {
          response.setAttribute('value', 'Error: Could not reach Ollama. Make sure it is running.');
        }
        currentInput = '';
        isWaiting = false;
      }
    </script>
  </body>
</html>
