<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DiscreteVR — Graph Theory</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <a-scene fog="type: linear; color: #0a1230; near: 18; far: 60">
      <a-sky material="shader: skygradient; topColor: #05070f; bottomColor: #12203f"></a-sky>
      <a-entity starfield="count: 550; radius: 70"></a-entity>
      <!-- Animated graph network drifting in the background (thematic) -->
      <a-entity graph-bg="count: 26; radius: 30; linkDist: 13"></a-entity>

      <a-light type="ambient" color="#9aa8d0" intensity="0.85"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.45" position="3 6 4"></a-light>
      <a-light type="point" color="#e94560" intensity="0.4" position="0 6 0" distance="30"></a-light>

      <a-plane rotation="-90 0 0" width="120" height="120" position="0 0 0"
               material="shader: flat; color: #070c1c"></a-plane>
      <a-entity geometry="primitive: plane; width: 120; height: 120; segmentsWidth: 60; segmentsHeight: 60"
                rotation="-90 0 0" position="0 0.02 0"
                material="wireframe: true; color: #21486b; shader: flat; opacity: 0.6; transparent: true"></a-entity>

      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls wasd-controls>
          <a-cursor
            color="#e94560"
            fuse="false"
            raycaster="objects: .clickable"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.018"
            material="color: #e94560; shader: flat">
          </a-cursor>
        </a-camera>
      </a-entity>

      <!-- Title + branding + signature -->
      <a-entity position="0 9.3 -12"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 42000; easing: linear">
        <a-icosahedron radius="1.1" material="wireframe: true; shader: flat; color: #4ce0b3"></a-icosahedron>
        <a-octahedron radius="0.6" material="wireframe: true; shader: flat; color: #e94560"></a-octahedron>
      </a-entity>
      <a-entity position="0 7 -12">
        <a-text value="Graph Theory" align="center" color="white" scale="3 3 3"></a-text>
        <a-plane width="4.8" height="0.04" position="0 -0.75 0" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="DiscreteVR" align="center" position="0 -1.15 0" color="#4ce0b3" scale="0.9 0.9 0.9"></a-text>
      </a-entity>

      <!-- Back button -->
      <a-entity position="0 0.6 -5">
        <a-plane width="1.75" height="0.62" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.25"></a-plane>
        <a-plane class="clickable" navigate-on-click="url: index.html" hover-glow
                 width="1.6" height="0.5" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Back to Hub" align="center" position="0 0 0.02" color="white" scale="1 1 1"></a-text>
      </a-entity>

      <!-- ===== VERTICES & EDGES — angle -90 ===== -->
      <a-entity position="-12 2.5 0" rotation="0 90 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Vertices &amp; Edges" align="center" position="0 2.4 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <a-sphere radius="0.18" color="#4ecca3" position="-0.8 1.3 0.05"></a-sphere>
        <a-sphere radius="0.18" color="#4ecca3" position="0.8 1.3 0.05"></a-sphere>
        <a-sphere radius="0.18" color="#4ecca3" position="0 0.6 0.05"></a-sphere>
        <a-box width="1.65" height="0.05" depth="0.03" color="white" position="0 1.3 0.05"></a-box>
        <a-box width="0.95" height="0.05" depth="0.03" rotation="0 0 38" color="white" position="-0.42 0.95 0.05"></a-box>
        <a-box width="0.95" height="0.05" depth="0.03" rotation="0 0 -38" color="white" position="0.42 0.95 0.05"></a-box>
        <a-text value="A" align="center" position="-0.8 1.6 0.05" color="#e94560" scale="1 1 1"></a-text>
        <a-text value="B" align="center" position="0.8 1.6 0.05" color="#e94560" scale="1 1 1"></a-text>
        <a-text value="C" align="center" position="0 0.3 0.05" color="#e94560" scale="1 1 1"></a-text>
        <a-text value="A vertex is a node in a graph.\nAn edge connects two vertices.\nG = (V, E) where V = vertices,\nE = edges."
          align="center" position="0 -0.4 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="V = {A, B, C}    E = {AB, AC, BC}"
          align="center" position="0 -1.6 0.01" color="#4ecca3" scale="0.9 0.9 0.9" width="4.5"></a-text>
      </a-entity>

      <!-- ===== DEGREE OF A VERTEX — angle -54 ===== -->
      <a-entity position="-9.7 2.5 -7" rotation="0 54 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Degree of a Vertex" align="center" position="0 2.4 0.01" color="#e94560" scale="1.4 1.4 1.4"></a-text>
        <a-sphere radius="0.22" color="#e94560" position="0 1.2 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="-1 1.7 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="1 1.7 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="0 0.3 0.05"></a-sphere>
        <a-box width="1.1" height="0.05" depth="0.03" rotation="0 0 25" color="white" position="-0.52 1.47 0.05"></a-box>
        <a-box width="1.1" height="0.05" depth="0.03" rotation="0 0 -25" color="white" position="0.52 1.47 0.05"></a-box>
        <a-box width="0.95" height="0.05" depth="0.03" rotation="0 0 90" color="white" position="0 0.75 0.05"></a-box>
        <a-text value="V" align="center" position="0 1.2 0.08" color="white" scale="0.9 0.9 0.9"></a-text>
        <a-text value="The degree of a vertex is the\nnumber of edges connected to it.\n\ndeg(V) = 3 in this example.\n\nSum of all degrees = 2 x |E|\n(Handshaking Lemma)"
          align="center" position="0 -0.3 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== PATHS & WALKS — angle -18 ===== -->
      <a-entity position="-3.7 2.5 -11.4" rotation="0 18 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Paths &amp; Walks" align="center" position="0 2.4 0.01" color="#e94560" scale="1.6 1.6 1.6"></a-text>
        <a-sphere radius="0.15" color="#4ecca3" position="-1.5 1.3 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="-0.5 1.3 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="0.5 1.3 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="1.5 1.3 0.05"></a-sphere>
        <a-box width="1.05" height="0.05" depth="0.03" color="#e94560" position="-1 1.3 0.05"></a-box>
        <a-box width="1.05" height="0.05" depth="0.03" color="#e94560" position="0 1.3 0.05"></a-box>
        <a-box width="1.05" height="0.05" depth="0.03" color="#e94560" position="1 1.3 0.05"></a-box>
        <a-text value="A" align="center" position="-1.5 1.6 0.05" color="white" scale="0.9 0.9 0.9"></a-text>
        <a-text value="B" align="center" position="-0.5 1.6 0.05" color="white" scale="0.9 0.9 0.9"></a-text>
        <a-text value="C" align="center" position="0.5 1.6 0.05" color="white" scale="0.9 0.9 0.9"></a-text>
        <a-text value="D" align="center" position="1.5 1.6 0.05" color="white" scale="0.9 0.9 0.9"></a-text>
        <a-text value="A Walk visits vertices and edges\nin sequence, repeats allowed.\n\nA Path is a walk with NO\nrepeated vertices.\n\nA→B→C→D is a path.\nA→B→A→C is a walk, not a path."
          align="center" position="0 -0.1 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== DIRECTED vs UNDIRECTED — angle +18 ===== -->
      <a-entity position="3.7 2.5 -11.4" rotation="0 -18 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Directed vs Undirected" align="center" position="0 2.4 0.01" color="#e94560" scale="1.3 1.3 1.3"></a-text>
        <a-text value="Undirected" align="center" position="-1.1 1.9 0.01" color="#4ecca3" scale="0.9 0.9 0.9"></a-text>
        <a-sphere radius="0.15" color="#4ecca3" position="-1.5 1.3 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="-0.7 1.3 0.05"></a-sphere>
        <a-box width="0.85" height="0.05" depth="0.03" color="white" position="-1.1 1.3 0.05"></a-box>
        <a-text value="Directed" align="center" position="1.1 1.9 0.01" color="#e94560" scale="0.9 0.9 0.9"></a-text>
        <a-sphere radius="0.15" color="#e94560" position="0.7 1.3 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#e94560" position="1.5 1.3 0.05"></a-sphere>
        <a-box width="0.85" height="0.05" depth="0.03" color="white" position="1.1 1.3 0.05"></a-box>
        <a-cone radius-bottom="0.07" radius-top="0" height="0.15" rotation="0 0 -90" position="1.5 1.3 0.05" color="white"></a-cone>
        <a-text value="Undirected: edges have no\ndirection. A-B = B-A.\n\nDirected (Digraph): edges have\na direction. A→B ≠ B→A.\n\nDirected graphs model one-way\nrelationships like web links."
          align="center" position="0 -0.1 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== WEIGHTED GRAPHS — angle +54 ===== -->
      <a-entity position="9.7 2.5 -7" rotation="0 -54 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Weighted Graphs" align="center" position="0 2.4 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <a-sphere radius="0.18" color="#4ecca3" position="-1 1.5 0.05"></a-sphere>
        <a-sphere radius="0.18" color="#4ecca3" position="1 1.5 0.05"></a-sphere>
        <a-sphere radius="0.18" color="#4ecca3" position="0 0.6 0.05"></a-sphere>
        <a-box width="2.05" height="0.05" depth="0.03" color="white" position="0 1.5 0.05"></a-box>
        <a-box width="1.2" height="0.05" depth="0.03" rotation="0 0 38" color="white" position="-0.52 1.07 0.05"></a-box>
        <a-box width="1.2" height="0.05" depth="0.03" rotation="0 0 -38" color="white" position="0.52 1.07 0.05"></a-box>
        <a-text value="A" align="center" position="-1 1.8 0.05" color="#e94560" scale="0.9 0.9 0.9"></a-text>
        <a-text value="B" align="center" position="1 1.8 0.05" color="#e94560" scale="0.9 0.9 0.9"></a-text>
        <a-text value="C" align="center" position="0 0.3 0.05" color="#e94560" scale="0.9 0.9 0.9"></a-text>
        <a-text value="5" align="center" position="0 1.65 0.05" color="#ff6b8a" scale="0.9 0.9 0.9"></a-text>
        <a-text value="3" align="center" position="-0.65 1.1 0.05" color="#ff6b8a" scale="0.9 0.9 0.9"></a-text>
        <a-text value="7" align="center" position="0.65 1.1 0.05" color="#ff6b8a" scale="0.9 0.9 0.9"></a-text>
        <a-text value="Each edge has a numerical\nweight (cost, distance, time).\n\nUsed in shortest path problems\nlike Dijkstra's algorithm.\n\nShortest path A→C = 3\n(direct), not 5+7=12 via B."
          align="center" position="0 -0.5 0.01" color="white" scale="0.9 0.9 0.9" width="4.5"></a-text>
      </a-entity>

      <!-- ===== TREES — angle +90 ===== -->
      <a-entity position="12 2.5 0" rotation="0 -90 0">
        <a-plane width="5.2" height="6.2" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="5" height="6" material="shader: flat; color: #0f3460; opacity: 0.97"></a-plane>
        <a-text value="Trees" align="center" position="0 2.4 0.01" color="#e94560" scale="1.8 1.8 1.8"></a-text>
        <a-sphere radius="0.18" color="#e94560" position="0 1.8 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="-1 1.1 0.05"></a-sphere>
        <a-sphere radius="0.15" color="#4ecca3" position="1 1.1 0.05"></a-sphere>
        <a-sphere radius="0.12" color="#4ecca3" position="-1.5 0.4 0.05"></a-sphere>
        <a-sphere radius="0.12" color="#4ecca3" position="-0.5 0.4 0.05"></a-sphere>
        <a-sphere radius="0.12" color="#4ecca3" position="1 0.4 0.05"></a-sphere>
        <a-box width="1.2" height="0.05" depth="0.03" rotation="0 0 33" color="white" position="-0.52 1.47 0.05"></a-box>
        <a-box width="1.2" height="0.05" depth="0.03" rotation="0 0 -33" color="white" position="0.52 1.47 0.05"></a-box>
        <a-box width="0.8" height="0.05" depth="0.03" rotation="0 0 40" color="white" position="-1.27 0.77 0.05"></a-box>
        <a-box width="0.8" height="0.05" depth="0.03" rotation="0 0 -40" color="white" position="-0.73 0.77 0.05"></a-box>
        <a-box width="0.75" height="0.05" depth="0.03" rotation="0 0 90" color="white" position="1 0.77 0.05"></a-box>
        <a-text value="Root" align="center" position="0.5 1.8 0.05" color="#e94560" scale="0.7 0.7 0.7"></a-text>
        <a-text value="A tree is a connected graph\nwith NO cycles.\n\nProperties:\n- N vertices = N-1 edges\n- Exactly one path between\n  any two vertices\n- Removing any edge\n  disconnects the graph"
          align="center" position="0 -0.6 0.01" color="white" scale="0.9 0.9 0.9" width="4.5"></a-text>
      </a-entity>

      <!-- ===== AI TUTOR PANEL ===== -->
      <a-entity position="0 2.5 8" rotation="0 180 0">
        <a-plane width="10.4" height="8.4" position="0 0 -0.03" material="shader: flat; color: #e94560; opacity: 0.22"></a-plane>
        <a-plane width="10" height="8" material="shader: flat; color: #0a1628; opacity: 0.98"></a-plane>
        <a-text value="AI Tutor — Graph Theory" align="center" position="0 3.4 0.01" color="#e94560" scale="1.3 1.3 1.3"></a-text>
        <a-box width="9.5" height="0.03" depth="0.01" color="#e94560" position="0 3.05 0.01"></a-box>

        <a-text id="input-display" value="Gaze at letters to type..." align="left" position="-4.3 2.4 0.01" color="white" scale="0.8 0.8 0.8" width="9"></a-text>

        <a-plane width="9" height="2" material="shader: flat; color: #071020" position="0 1.55 0.01"></a-plane>
        <a-text id="response-display" value="Response will appear here..." align="left" position="-4.3 2.0 0.05" color="#ccc" scale="0.6 0.6 0.6" width="13" wrap-count="90" baseline="top"></a-text>

        <!-- ROW 1: Q-P -->
        <a-plane class="clickable" keyboard-key="letter: Q" position="-4.25 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="Q" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: W" position="-3.5 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="W" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: E" position="-2.75 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="E" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: R" position="-2.0 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="R" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: T" position="-1.25 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="T" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: Y" position="-0.5 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="Y" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: U" position="0.25 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="U" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: I" position="1.0 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="I" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: O" position="1.75 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="O" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: P" position="2.5 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="P" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

        <!-- ROW 2: A-L -->
        <a-plane class="clickable" keyboard-key="letter: A" position="-3.875 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="A" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: S" position="-3.125 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="S" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: D" position="-2.375 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="D" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: F" position="-1.625 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="F" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: G" position="-0.875 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="G" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: H" position="-0.125 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="H" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: J" position="0.625 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="J" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: K" position="1.375 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="K" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: L" position="2.125 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="L" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

        <!-- ROW 3: Z-M -->
        <a-plane class="clickable" keyboard-key="letter: Z" position="-3.5 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="Z" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: X" position="-2.75 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="X" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: C" position="-2.0 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="C" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: V" position="-1.25 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="V" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: B" position="-0.5 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="B" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: N" position="0.25 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="N" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: M" position="1.0 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="M" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

        <!-- BOTTOM ROW: CLEAR / SPACE / BACKSPACE -->
        <a-plane class="clickable" keyboard-key="letter: CLEAR" position="-3.5 -2.05 0.02" width="1.5" height="0.55" color="#8b1a2b"><a-text value="CLEAR" align="center" position="0 0 0.01" color="white" scale="0.6 0.6 0.6"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: SPACE" position="-0.75 -2.05 0.02" width="3.5" height="0.55" color="#0f3460"><a-text value="SPACE" align="center" position="0 0 0.01" color="white" scale="0.8 0.8 0.8"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: BACK" position="2.55 -2.05 0.02" width="1.6" height="0.55" color="#8b1a2b"><a-text value="BACKSPACE" align="center" position="0 0 0.01" color="white" scale="0.5 0.5 0.5"></a-text></a-plane>

        <!-- ASK button -->
        <a-plane class="clickable" keyboard-key="letter: ASK" position="3.95 -1.05 0.02" width="1.4" height="1.4" color="#e94560"><a-text value="ASK\nPhi-3" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

      </a-entity>

    </a-scene>

    <script>
      AFRAME.registerShader('skygradient', {
        schema: {
          topColor:    { type: 'color', default: '#05070f', is: 'uniform' },
          bottomColor: { type: 'color', default: '#12203f', is: 'uniform' }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 bottomColor;
          varying vec3 vWorldPosition;
          void main() {
            float h = normalize(vWorldPosition).y;
            gl_FragColor = vec4(mix(bottomColor, topColor, max(0.0, h)), 1.0);
          }
        `
      });

      AFRAME.registerComponent('starfield', {
        schema: { count: { default: 600 }, radius: { default: 70 } },
        init: function () {
          const geometry = new THREE.BufferGeometry();
          const positions = [];
          for (let i = 0; i < this.data.count; i++) {
            const r = this.data.radius * (0.55 + Math.random() * 0.45);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions.push(
              r * Math.sin(phi) * Math.cos(theta),
              r * Math.cos(phi),
              r * Math.sin(phi) * Math.sin(theta)
            );
          }
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          const material = new THREE.PointsMaterial({
            color: 0xbfd0ff, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.9
          });
          this.el.setObject3D('stars', new THREE.Points(geometry, material));
        }
      });

      // Animated graph network drifting in the background
      AFRAME.registerComponent('graph-bg', {
        schema: { count: { default: 26 }, radius: { default: 30 }, linkDist: { default: 13 } },
        init: function () {
          const group = new THREE.Group();
          const nodes = [];
          const N = this.data.count;
          for (let i = 0; i < N; i++) {
            const r = this.data.radius * (0.7 + Math.random() * 0.3);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.75;
            nodes.push(new THREE.Vector3(
              r * Math.sin(phi) * Math.cos(theta),
              Math.abs(r * Math.cos(phi)) + 3,
              r * Math.sin(phi) * Math.sin(theta)
            ));
          }
          const nodeGeo = new THREE.BufferGeometry().setFromPoints(nodes);
          const nodeMat = new THREE.PointsMaterial({ color: 0x4ce0b3, size: 0.7, sizeAttenuation: true, transparent: true, opacity: 0.8 });
          group.add(new THREE.Points(nodeGeo, nodeMat));

          const linePts = [];
          for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
              if (nodes[i].distanceTo(nodes[j]) < this.data.linkDist) {
                linePts.push(nodes[i].x, nodes[i].y, nodes[i].z, nodes[j].x, nodes[j].y, nodes[j].z);
              }
            }
          }
          const lineGeo = new THREE.BufferGeometry();
          lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePts, 3));
          const lineMat = new THREE.LineBasicMaterial({ color: 0x2f6d8f, transparent: true, opacity: 0.35 });
          group.add(new THREE.LineSegments(lineGeo, lineMat));

          this.el.setObject3D('graphbg', group);
          this.group = group;
        },
        tick: function (t, dt) {
          if (this.group && dt) { this.group.rotation.y += (dt / 1000) * 0.03; }
        }
      });

      AFRAME.registerComponent('navigate-on-click', {
        schema: { url: { type: 'string' } },
        init: function () {
          this.el.addEventListener('click', () => { window.location.href = this.data.url; });
        }
      });

      AFRAME.registerComponent('hover-glow', {
        init: function () {
          const el = this.el;
          const originalColor = el.getAttribute('material') ? el.getAttribute('material').color : el.getAttribute('color');
          el.addEventListener('mouseenter', () => { el.setAttribute('material', 'color', '#ff6b8a'); });
          el.addEventListener('mouseleave', () => { el.setAttribute('material', 'color', originalColor); });
        }
      });

      let currentInput = '';
      let isWaiting = false;

      AFRAME.registerComponent('keyboard-key', {
        schema: { letter: { type: 'string' } },
        init: function () {
          const el = this.el;
          const letter = this.data.letter;
          const originalColor = el.getAttribute('color');

          el.addEventListener('mouseenter', () => { el.setAttribute('color', '#ff6b8a'); });
          el.addEventListener('mouseleave', () => { el.setAttribute('color', originalColor); });

          el.addEventListener('click', () => {
            if (isWaiting) return;
            const display = document.getElementById('input-display');

            if (letter === 'SPACE') {
              currentInput += ' ';
            } else if (letter === 'BACK') {
              currentInput = currentInput.slice(0, -1);
            } else if (letter === 'CLEAR') {
              currentInput = '';
            } else if (letter === 'ASK') {
              if (currentInput.trim() === '') return;
              askTutor(currentInput.trim());
              return;
            } else {
              currentInput += letter;
            }

            display.setAttribute('value', currentInput || 'Gaze at letters to type...');
          });
        }
      });

      async function askTutor(question) {
        isWaiting = true;
        const response = document.getElementById('response-display');
        const display = document.getElementById('input-display');
        response.setAttribute('value', 'Thinking...');
        display.setAttribute('value', 'Q: ' + question);

        try {
          const res = await fetch('http://localhost:11434/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'phi3',
              prompt: 'You are a discrete mathematics tutor. Answer this question about graph theory concisely in 3-4 sentences max: ' + question,
              stream: false
            })
          });
          const data = await res.json();
          response.setAttribute('value', 'Q: ' + question + '\n\n' + data.response);
        } catch (err) {
          response.setAttribute('value', 'Error: Could not reach Ollama. Make sure it is running.');
        }

        currentInput = '';
        isWaiting = false;
      }
    </script>
  </body>
</html>
