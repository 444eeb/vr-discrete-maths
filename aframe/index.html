<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DiscreteVR — Hub</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('navigate-on-click', {
        schema: { url: { type: 'string' } },
        init: function () { this.el.addEventListener('click', () => { window.location.href = this.data.url; }); }
      });

      AFRAME.registerComponent('hover-glow', {
        init: function () {
          const el = this.el;
          const originalColor = el.getAttribute('material') ? el.getAttribute('material').color : el.getAttribute('color');
          el.addEventListener('mouseenter', () => { el.setAttribute('material', 'color', '#ff6b8a'); });
          el.addEventListener('mouseleave', () => { el.setAttribute('material', 'color', originalColor); });
        }
      });

      AFRAME.registerShader('skygradient', {
        schema: {
          topColor:    { type: 'color', default: '#05070f', is: 'uniform' },
          bottomColor: { type: 'color', default: '#12203f', is: 'uniform' }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 bottomColor;
          varying vec3 vWorldPosition;
          void main() {
            float h = normalize(vWorldPosition).y;
            gl_FragColor = vec4(mix(bottomColor, topColor, max(0.0, h)), 1.0);
          }
        `
      });

      AFRAME.registerComponent('starfield', {
        schema: { count: { default: 600 }, radius: { default: 70 } },
        init: function () {
          const geometry = new THREE.BufferGeometry();
          const positions = [];
          for (let i = 0; i < this.data.count; i++) {
            const r = this.data.radius * (0.55 + Math.random() * 0.45);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
          }
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          const material = new THREE.PointsMaterial({ color: 0xbfd0ff, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.9 });
          this.el.setObject3D('stars', new THREE.Points(geometry, material));
        }
      });

      // Layered low-poly wireframe hills receding into the distance for depth
      AFRAME.registerComponent('hills', {
        init: function () {
          const layers = [
            { z: -20, w: 80,  base: -3, amp: 4.5, seg: 22, fill: 0x11203a, wire: 0x2f5a8f },
            { z: -30, w: 105, base: -3, amp: 7.0, seg: 26, fill: 0x0d1a30, wire: 0x264a76 },
            { z: -42, w: 140, base: -3, amp: 10.5,seg: 30, fill: 0x0a1526, wire: 0x1d3a5c },
            { z: -54, w: 180, base: -3, amp: 14.0,seg: 34, fill: 0x081120, wire: 0x172d48 }
          ];
          const group = new THREE.Group();
          layers.forEach((L) => {
            const positions = [];
            const half = L.w / 2;
            const step = L.w / L.seg;
            const tops = [];
            for (let i = 0; i <= L.seg; i++) {
              const n = Math.abs(Math.sin(i * 0.7) + 0.6 * Math.sin(i * 0.31 + 1.3));
              tops.push(L.base + n * L.amp * 0.7 + Math.random() * L.amp * 0.5);
            }
            for (let i = 0; i < L.seg; i++) {
              const x0 = -half + i * step, x1 = -half + (i + 1) * step;
              const t0 = tops[i], t1 = tops[i + 1];
              positions.push(x0, L.base, L.z,  x1, L.base, L.z,  x1, t1, L.z);
              positions.push(x0, L.base, L.z,  x1, t1, L.z,  x0, t0, L.z);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: L.fill, side: THREE.DoubleSide })));
            group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: L.wire, wireframe: true })));
          });
          this.el.setObject3D('hills', group);
        }
      });
    </script>
  </head>
  <body>
    <a-scene fog="type: linear; color: #0a1230; near: 20; far: 62">

      <a-sky material="shader: skygradient; topColor: #05070f; bottomColor: #12203f"></a-sky>
      <a-entity starfield="count: 600; radius: 70"></a-entity>
      <a-entity hills></a-entity>

      <a-light type="ambient" color="#8899cc" intensity="0.7"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.5" position="2 4 3"></a-light>
      <a-light type="point" color="#e94560" intensity="0.5" position="0 4 -4" distance="25"></a-light>

      <a-plane rotation="-90 0 0" width="120" height="120" position="0 0 0"
               material="shader: flat; color: #070c1c"></a-plane>
      <a-entity geometry="primitive: plane; width: 120; height: 120; segmentsWidth: 60; segmentsHeight: 60"
                rotation="-90 0 0" position="0 0.02 0"
                material="wireframe: true; color: #21486b; shader: flat; opacity: 0.6; transparent: true"></a-entity>

      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls wasd-controls>
          <a-cursor color="#e94560" fuse="false" raycaster="objects: .clickable"></a-cursor>
        </a-camera>
      </a-entity>

      <!-- HERO -->
      <a-entity position="0 7.7 -12"
                animation="property: position; to: 0 8.2 -12; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine">
        <a-icosahedron radius="2.7" material="wireframe: true; shader: flat; color: #4ce0b3"
                       animation="property: rotation; to: 0 360 0; loop: true; dur: 48000; easing: linear"></a-icosahedron>
        <a-octahedron radius="1.5" material="wireframe: true; shader: flat; color: #e94560"
                      animation="property: rotation; to: 360 0 360; loop: true; dur: 32000; easing: linear"></a-octahedron>
        <a-sphere radius="0.45" material="shader: flat; color: #b8f5e6"></a-sphere>
        <a-sphere radius="1.0" material="shader: flat; color: #4ce0b3; opacity: 0.12; transparent: true"></a-sphere>
      </a-entity>

      <!-- TITLE (lifted clear of the top row) -->
      <a-entity position="0 5.4 -5.5">
        <a-text value="DiscreteVR" align="center" color="#ffffff" position="0 0 0" scale="3.4 3.4 3.4"></a-text>
        <a-plane width="3.4" height="0.03" position="0 -0.62 0" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Discrete Mathematics Revision in VR" align="center" color="#4ce0b3"
                position="0 -0.95 0" scale="1.05 1.05 1.05"></a-text>
      </a-entity>

      <!-- ===== ROW 1 (top) ===== -->
      <!-- Logic Gates -->
      <a-entity position="-4.4 2.7 -4.3" rotation="0 20 0">
        <a-plane width="2.65" height="1.7" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.3"></a-plane>
        <a-plane width="2.5" height="1.55" material="shader: flat; color: #0f3460"></a-plane>
        <a-text value="Logic Gates" align="center" color="#ffffff" position="0 0.45 0.02" scale="1.15 1.15 1.15"></a-text>
        <a-plane width="1.4" height="0.02" position="0 0.28 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="AND · OR · NOT · XOR" align="center" color="#4ce0b3" position="0 0.08 0.02" scale="0.5 0.5 0.5"></a-text>
        <a-plane class="clickable" navigate-on-click="url: logic-gates.html" hover-glow
                 width="1.05" height="0.38" position="0 -0.45 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Enter" align="center" color="#ffffff" position="0 -0.45 0.04" scale="0.95 0.95 0.95"></a-text>
      </a-entity>

      <!-- Graph Theory -->
      <a-entity position="0 2.7 -4.9" rotation="0 0 0">
        <a-plane width="2.65" height="1.7" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.3"></a-plane>
        <a-plane width="2.5" height="1.55" material="shader: flat; color: #0f3460"></a-plane>
        <a-text value="Graph Theory" align="center" color="#ffffff" position="0 0.45 0.02" scale="1.1 1.1 1.1"></a-text>
        <a-plane width="1.4" height="0.02" position="0 0.28 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Vertices · Edges · Paths" align="center" color="#4ce0b3" position="0 0.08 0.02" scale="0.48 0.48 0.48"></a-text>
        <a-plane class="clickable" navigate-on-click="url: graph-theory.html" hover-glow
                 width="1.05" height="0.38" position="0 -0.45 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Enter" align="center" color="#ffffff" position="0 -0.45 0.04" scale="0.95 0.95 0.95"></a-text>
      </a-entity>

      <!-- Set Theory -->
      <a-entity position="4.4 2.7 -4.3" rotation="0 -20 0">
        <a-plane width="2.65" height="1.7" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.3"></a-plane>
        <a-plane width="2.5" height="1.55" material="shader: flat; color: #0f3460"></a-plane>
        <a-text value="Set Theory" align="center" color="#ffffff" position="0 0.45 0.02" scale="1.15 1.15 1.15"></a-text>
        <a-plane width="1.4" height="0.02" position="0 0.28 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Union · Intersection" align="center" color="#4ce0b3" position="0 0.08 0.02" scale="0.5 0.5 0.5"></a-text>
        <a-plane class="clickable" navigate-on-click="url: set-theory.html" hover-glow
                 width="1.05" height="0.38" position="0 -0.45 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Enter" align="center" color="#ffffff" position="0 -0.45 0.04" scale="0.95 0.95 0.95"></a-text>
      </a-entity>

      <!-- ===== ROW 2 (bottom) ===== -->
      <!-- Propositional Logic -->
      <a-entity position="-4.4 1.05 -4.3" rotation="0 20 0">
        <a-plane width="2.65" height="1.7" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.3"></a-plane>
        <a-plane width="2.5" height="1.55" material="shader: flat; color: #0f3460"></a-plane>
        <a-text value="Propositional Logic" align="center" color="#ffffff" position="0 0.45 0.02" scale="0.88 0.88 0.88"></a-text>
        <a-plane width="1.4" height="0.02" position="0 0.28 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Truth tables · AND OR NOT" align="center" color="#4ce0b3" position="0 0.08 0.02" scale="0.44 0.44 0.44"></a-text>
        <a-plane class="clickable" navigate-on-click="url: propositional-logic.html" hover-glow
                 width="1.05" height="0.38" position="0 -0.45 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Enter" align="center" color="#ffffff" position="0 -0.45 0.04" scale="0.95 0.95 0.95"></a-text>
      </a-entity>

      <!-- Combinatorics -->
      <a-entity position="0 1.05 -4.9" rotation="0 0 0">
        <a-plane width="2.65" height="1.7" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.3"></a-plane>
        <a-plane width="2.5" height="1.55" material="shader: flat; color: #0f3460"></a-plane>
        <a-text value="Combinatorics" align="center" color="#ffffff" position="0 0.45 0.02" scale="1.02 1.02 1.02"></a-text>
        <a-plane width="1.4" height="0.02" position="0 0.28 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Permutations · Combinations" align="center" color="#4ce0b3" position="0 0.08 0.02" scale="0.43 0.43 0.43"></a-text>
        <a-plane class="clickable" navigate-on-click="url: combinatorics.html" hover-glow
                 width="1.05" height="0.38" position="0 -0.45 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Enter" align="center" color="#ffffff" position="0 -0.45 0.04" scale="0.95 0.95 0.95"></a-text>
      </a-entity>

      <!-- Proofs -->
      <a-entity position="4.4 1.05 -4.3" rotation="0 -20 0">
        <a-plane width="2.65" height="1.7" position="0 0 -0.02" material="shader: flat; color: #e94560; opacity: 0.3"></a-plane>
        <a-plane width="2.5" height="1.55" material="shader: flat; color: #0f3460"></a-plane>
        <a-text value="Proofs" align="center" color="#ffffff" position="0 0.45 0.02" scale="1.25 1.25 1.25"></a-text>
        <a-plane width="1.4" height="0.02" position="0 0.28 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Induction · Contradiction" align="center" color="#4ce0b3" position="0 0.08 0.02" scale="0.46 0.46 0.46"></a-text>
        <a-plane class="clickable" navigate-on-click="url: proofs.html" hover-glow
                 width="1.05" height="0.38" position="0 -0.45 0.02" material="shader: flat; color: #e94560"></a-plane>
        <a-text value="Enter" align="center" color="#ffffff" position="0 -0.45 0.04" scale="0.95 0.95 0.95"></a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
