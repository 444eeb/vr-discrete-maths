<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Set Theory</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <a-scene>
      <a-sky color="#1a1a2e"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#16213e"></a-plane>

      <a-entity position="0 1.6 0">
        <a-camera look-controls wasd-controls>
          <a-cursor
            color="#e94560"
            fuse="false"
            raycaster="objects: .clickable"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.018"
            material="color: #e94560; shader: flat">
          </a-cursor>
        </a-camera>
      </a-entity>

      <!-- Title -->
      <a-text value="Set Theory" align="center" position="0 6.5 -12" color="white" scale="3 3 3"></a-text>

      <!-- Back button -->
      <a-entity position="0 0.5 -5">
        <a-plane class="clickable" navigate-on-click="url: index.html" width="1.5" height="0.5" color="#e94560"></a-plane>
        <a-text value="Back to Hub" align="center" position="0 0 0.01" color="white" scale="1 1 1"></a-text>
      </a-entity>

      <!-- ===== SETS & NOTATION — angle -90 ===== -->
      <a-entity position="-12 3 0" rotation="0 90 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Sets &amp; Notation" align="center" position="0 3.5 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <a-torus radius="0.9" radius-tubular="0.03" color="#4ecca3" position="0 2.0 0.01"></a-torus>
        <a-text value="1" align="center" position="-0.5 2.4 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="2" align="center" position="0.4 2.3 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="3" align="center" position="0.1 1.8 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="4" align="center" position="-0.3 1.6 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="A" align="center" position="0.75 1.2 0.05" color="#4ecca3" scale="1.1 1.1 1.1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.9 0.01"></a-box>
        <a-text value="A set is an unordered collection\nof distinct elements." align="center" position="0 0.4 0.01" color="white" scale="1 1 1" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.1 0.01"></a-box>
        <a-text value="A = {1, 2, 3, 4}" align="center" position="0 -0.55 0.01" color="#4ecca3" scale="1 1 1" width="4.5"></a-text>
        <a-text value="B = {x | x > 0}  (set builder)" align="center" position="0 -1.05 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -1.45 0.01"></a-box>
        <a-text value="Empty set: {}" align="center" position="0 -1.9 0.01" color="white" scale="1 1 1" width="4.5"></a-text>
        <a-text value="|A| = cardinality (size of A)" align="center" position="0 -2.4 0.01" color="white" scale="1 1 1" width="4.5"></a-text>
      </a-entity>

      <!-- ===== UNION — angle -54 ===== -->
      <a-entity position="-9.7 3 -7" rotation="0 54 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Union  A U B" align="center" position="0 3.5 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <a-torus radius="0.8" radius-tubular="0.03" color="#4ecca3" position="-0.45 2.0 0.01"></a-torus>
        <a-torus radius="0.8" radius-tubular="0.03" color="#e94560" position="0.45 2.0 0.01"></a-torus>
        <a-plane width="0.55" height="1.3" color="#ff6b8a" opacity="0.3" position="0 2.0 0.005"></a-plane>
        <a-text value="A" align="center" position="-0.9 2.7 0.05" color="#4ecca3" scale="1.1 1.1 1.1"></a-text>
        <a-text value="B" align="center" position="0.9 2.7 0.05" color="#e94560" scale="1.1 1.1 1.1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.9 0.01"></a-box>
        <a-text value="A = {1, 2, 3}   B = {3, 4, 5}" align="center" position="0 0.45 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="A U B = {1, 2, 3, 4, 5}" align="center" position="0 -0.1 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.5 0.01"></a-box>
        <a-text value="Union contains ALL elements\nfrom BOTH sets.\nDuplicates are removed.\n\nx is in A U B if\nx is in A OR x is in B." align="center" position="0 -1.5 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== INTERSECTION — angle -18 ===== -->
      <a-entity position="-3.7 3 -11.4" rotation="0 18 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Intersection  A n B" align="center" position="0 3.5 0.01" color="#e94560" scale="1.3 1.3 1.3"></a-text>
        <a-torus radius="0.8" radius-tubular="0.03" color="#4ecca3" position="-0.45 2.0 0.01"></a-torus>
        <a-torus radius="0.8" radius-tubular="0.03" color="#e94560" position="0.45 2.0 0.01"></a-torus>
        <a-plane width="0.55" height="1.3" color="#4ecca3" opacity="0.5" position="0 2.0 0.005"></a-plane>
        <a-text value="A" align="center" position="-0.9 2.7 0.05" color="#4ecca3" scale="1.1 1.1 1.1"></a-text>
        <a-text value="B" align="center" position="0.9 2.7 0.05" color="#e94560" scale="1.1 1.1 1.1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.9 0.01"></a-box>
        <a-text value="A = {1, 2, 3}   B = {3, 4, 5}" align="center" position="0 0.45 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="A n B = {3}" align="center" position="0 -0.1 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.5 0.01"></a-box>
        <a-text value="Intersection contains only\nelements in BOTH sets.\n\nx is in A n B if\nx is in A AND x is in B.\n\nIf A n B = {} then\nA and B are disjoint." align="center" position="0 -1.8 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== COMPLEMENT — angle +18 ===== -->
      <a-entity position="3.7 3 -11.4" rotation="0 -18 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Complement  A'" align="center" position="0 3.5 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <a-plane width="2.8" height="2.0" color="#16213e" opacity="0.8" position="0 2.0 0.01"></a-plane>
        <a-torus radius="0.65" radius-tubular="0.03" color="#4ecca3" position="0 2.0 0.02"></a-torus>
        <a-text value="U" align="center" position="1.1 2.8 0.05" color="white" scale="0.9 0.9 0.9"></a-text>
        <a-text value="A" align="center" position="0 2.0 0.05" color="#4ecca3" scale="1 1 1"></a-text>
        <a-text value="A'" align="center" position="1.0 1.8 0.05" color="#e94560" scale="0.9 0.9 0.9"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.7 0.01"></a-box>
        <a-text value="U = {1,2,3,4,5}   A = {1, 2}" align="center" position="0 0.25 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="A' = {3, 4, 5}" align="center" position="0 -0.3 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.7 0.01"></a-box>
        <a-text value="Complement = all elements\nNOT in A, relative to U.\n\n(A')' = A\nA U A' = U\nA n A' = {}" align="center" position="0 -1.8 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== SUBSETS — angle +54 ===== -->
      <a-entity position="9.7 3 -7" rotation="0 -54 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Subsets" align="center" position="0 3.5 0.01" color="#e94560" scale="1.8 1.8 1.8"></a-text>
        <a-torus radius="1.1" radius-tubular="0.03" color="#4ecca3" position="0 2.0 0.01"></a-torus>
        <a-torus radius="0.6" radius-tubular="0.03" color="#e94560" position="0 2.0 0.01"></a-torus>
        <a-text value="B" align="center" position="0 2.0 0.05" color="#e94560" scale="1 1 1"></a-text>
        <a-text value="A" align="center" position="0.95 2.8 0.05" color="#4ecca3" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.6 0.01"></a-box>
        <a-text value="A = {1,2,3,4}   B = {2,3}" align="center" position="0 0.15 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="B is a subset of A" align="center" position="0 -0.4 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.8 0.01"></a-box>
        <a-text value="B is a subset of A if every\nelement of B is also in A.\n\nProper subset: B is a subset\nof A and B does not equal A.\n\nEvery set is a subset of itself.\n{} is a subset of every set." align="center" position="0 -2.1 0.01" color="white" scale="0.9 0.9 0.9" width="4.5"></a-text>
      </a-entity>

      <!-- ===== SET LAWS — angle +90 ===== -->
      <a-entity position="12 3 0" rotation="0 -90 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Set Laws" align="center" position="0 3.5 0.01" color="#e94560" scale="1.8 1.8 1.8"></a-text>
        <a-text value="De Morgan's Laws:" align="center" position="0 2.7 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="(A U B)' = A' n B'" align="center" position="0 2.2 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="(A n B)' = A' U B'" align="center" position="0 1.7 0.01" color="white" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 1.3 0.01"></a-box>
        <a-text value="Identity Laws:" align="center" position="0 0.9 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="A U {} = A" align="center" position="0 0.45 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="A n U = A" align="center" position="0 0.0 0.01" color="white" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.35 0.01"></a-box>
        <a-text value="Domination Laws:" align="center" position="0 -0.75 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="A U U = U" align="center" position="0 -1.2 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="A n {} = {}" align="center" position="0 -1.65 0.01" color="white" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -2.05 0.01"></a-box>
        <a-text value="Idempotent Laws:" align="center" position="0 -2.45 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="A U A = A" align="center" position="0 -2.9 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="A n A = A" align="center" position="0 -3.35 0.01" color="white" scale="1 1 1"></a-text>
      </a-entity>

      <!-- ===== AI TUTOR PANEL ===== -->
      <a-entity position="0 2.5 8" rotation="0 180 0">
        <a-plane width="10" height="8" color="#0a1628" opacity="0.97"></a-plane>
        <a-text value="AI Tutor — Set Theory" align="center" position="0 3.4 0.01" color="#e94560" scale="1.3 1.3 1.3"></a-text>
        <a-box width="9.5" height="0.03" depth="0.01" color="#e94560" position="0 3.05 0.01"></a-box>

        <a-text id="input-display" value="Gaze at letters to type..." align="left" position="-4.3 2.4 0.01" color="white" scale="0.8 0.8 0.8" width="9"></a-text>

        <a-plane width="9" height="2" color="#071020" position="0 1.55 0.01"></a-plane>
        <a-text id="response-display" value="Response will appear here..." align="left" position="-4.3 2.0 0.05" color="#ccc" scale="0.6 0.6 0.6" width="13" wrap-count="90" baseline="top"></a-text>

        <!-- ROW 1: Q-P -->
        <a-plane class="clickable" keyboard-key="letter: Q" position="-4.25 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="Q" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: W" position="-3.5 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="W" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: E" position="-2.75 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="E" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: R" position="-2.0 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="R" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: T" position="-1.25 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="T" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: Y" position="-0.5 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="Y" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: U" position="0.25 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="U" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: I" position="1.0 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="I" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: O" position="1.75 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="O" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: P" position="2.5 -0.1 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="P" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

        <!-- ROW 2: A-L -->
        <a-plane class="clickable" keyboard-key="letter: A" position="-3.875 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="A" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: S" position="-3.125 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="S" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: D" position="-2.375 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="D" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: F" position="-1.625 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="F" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: G" position="-0.875 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="G" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: H" position="-0.125 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="H" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: J" position="0.625 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="J" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: K" position="1.375 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="K" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: L" position="2.125 -0.75 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="L" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

        <!-- ROW 3: Z-M -->
        <a-plane class="clickable" keyboard-key="letter: Z" position="-3.5 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="Z" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: X" position="-2.75 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="X" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: C" position="-2.0 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="C" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: V" position="-1.25 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="V" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: B" position="-0.5 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="B" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: N" position="0.25 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="N" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: M" position="1.0 -1.4 0.02" width="0.7" height="0.55" color="#0f3460"><a-text value="M" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

        <!-- BOTTOM ROW: CLEAR / SPACE / BACKSPACE -->
        <a-plane class="clickable" keyboard-key="letter: CLEAR" position="-3.5 -2.05 0.02" width="1.5" height="0.55" color="#8b1a2b"><a-text value="CLEAR" align="center" position="0 0 0.01" color="white" scale="0.6 0.6 0.6"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: SPACE" position="-0.75 -2.05 0.02" width="3.5" height="0.55" color="#0f3460"><a-text value="SPACE" align="center" position="0 0 0.01" color="white" scale="0.8 0.8 0.8"></a-text></a-plane>
        <a-plane class="clickable" keyboard-key="letter: BACK" position="2.55 -2.05 0.02" width="1.6" height="0.55" color="#8b1a2b"><a-text value="BACKSPACE" align="center" position="0 0 0.01" color="white" scale="0.5 0.5 0.5"></a-text></a-plane>

        <!-- ASK button -->
        <a-plane class="clickable" keyboard-key="letter: ASK" position="3.95 -1.05 0.02" width="1.4" height="1.4" color="#e94560"><a-text value="ASK\nPhi-3" align="center" position="0 0 0.01" color="white" scale="0.9 0.9 0.9"></a-text></a-plane>

      </a-entity>

    </a-scene>

    <script>
      AFRAME.registerComponent('navigate-on-click', {
        schema: { url: { type: 'string' } },
        init: function () {
          this.el.addEventListener('click', () => {
            window.location.href = this.data.url;
          });
        }
      });

      let currentInput = '';
      let isWaiting = false;

      AFRAME.registerComponent('keyboard-key', {
        schema: { letter: { type: 'string' } },
        init: function () {
          const el = this.el;
          const letter = this.data.letter;
          const originalColor = el.getAttribute('color');

          el.addEventListener('mouseenter', () => {
            el.setAttribute('color', '#ff6b8a');
          });
          el.addEventListener('mouseleave', () => {
            el.setAttribute('color', originalColor);
          });

          el.addEventListener('click', () => {
            if (isWaiting) return;
            const display = document.getElementById('input-display');

            if (letter === 'SPACE') {
              currentInput += ' ';
            } else if (letter === 'BACK') {
              currentInput = currentInput.slice(0, -1);
            } else if (letter === 'CLEAR') {
              currentInput = '';
            } else if (letter === 'ASK') {
              if (currentInput.trim() === '') return;
              askTutor(currentInput.trim());
              return;
            } else {
              currentInput += letter;
            }

            display.setAttribute('value', currentInput || 'Gaze at letters to type...');
          });
        }
      });

      async function askTutor(question) {
        isWaiting = true;
        const response = document.getElementById('response-display');
        const display = document.getElementById('input-display');
        response.setAttribute('value', 'Thinking...');
        display.setAttribute('value', 'Q: ' + question);

        try {
          const res = await fetch('http://localhost:11434/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'phi3',
              prompt: 'You are a discrete mathematics tutor. Answer this question about set theory concisely in 3-4 sentences max: ' + question,
              stream: false
            })
          });
          const data = await res.json();
          response.setAttribute('value', 'Q: ' + question + '\n\n' + data.response);
        } catch (err) {
          response.setAttribute('value', 'Error: Could not reach Ollama. Make sure it is running.');
        }

        currentInput = '';
        isWaiting = false;
      }
    </script>
  </body>
</html>
