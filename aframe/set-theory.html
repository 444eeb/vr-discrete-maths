<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Set Theory</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      #tutor-overlay {
        position: fixed;
        bottom: 20px;
        right: auto;
        left: 50%;
        width: 600px;
        transform: translateX(-50%);
        background: rgba(15, 52, 96, 0.92);
        border: 1px solid #e94560;
        border-radius: 8px;
        padding: 16px;
        z-index: 999;
        font-family: sans-serif;
        color: white;
        pointer-events: auto;
      }
      #tutor-overlay h3 {
        margin: 0 0 10px 0;
        color: #e94560;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #response-box {
        background: rgba(0,0,0,0.4);
        border-radius: 4px;
        padding: 10px;
        font-size: 13px;
        line-height: 1.5;
        min-height: 120px;
        max-height: 280px;
        overflow-y: auto;
        margin-bottom: 10px;
        color: #ccc;
      }
      #question-input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #e94560;
        background: rgba(0,0,0,0.5);
        color: white;
        font-size: 13px;
        margin-bottom: 8px;
      }
      #ask-btn {
        width: 100%;
        padding: 8px;
        background: #e94560;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      #ask-btn:hover { background: #ff6b8a; }
      #ask-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <a-scene>
      <a-sky color="#1a1a2e"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#16213e"></a-plane>

      <a-entity position="0 1.6 0">
        <a-camera look-controls="pointerLockEnabled: true" wasd-controls>
          <a-cursor color="#e94560"></a-cursor>
        </a-camera>
      </a-entity>

      <!-- Title -->
      <a-text value="Set Theory" align="center" position="0 6.5 -12" color="white" scale="3 3 3"></a-text>

      <!-- Back button -->
      <a-entity position="0 0.5 -5">
        <a-plane navigate-on-click="url: index.html" width="1.5" height="0.5" color="#e94560"></a-plane>
        <a-text value="Back to Hub" align="center" position="0 0 0.01" color="white" scale="1 1 1"></a-text>
      </a-entity>

      <!-- ===== SETS & NOTATION — angle -90 ===== -->
      <a-entity position="-12 3 0" rotation="0 90 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Sets &amp; Notation" align="center" position="0 3.5 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <!-- Visual: circle with elements -->
        <a-torus radius="0.9" radius-tubular="0.03" color="#4ecca3" position="0 2.0 0.01"></a-torus>
        <a-text value="1" align="center" position="-0.5 2.4 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="2" align="center" position="0.4 2.3 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="3" align="center" position="0.1 1.8 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="4" align="center" position="-0.3 1.6 0.05" color="white" scale="1 1 1"></a-text>
        <a-text value="A" align="center" position="0.75 1.2 0.05" color="#4ecca3" scale="1.1 1.1 1.1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.9 0.01"></a-box>
        <a-text value="A set is an unordered collection\nof distinct elements." align="center" position="0 0.4 0.01" color="white" scale="1 1 1" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.1 0.01"></a-box>
        <a-text value="A = {1, 2, 3, 4}" align="center" position="0 -0.55 0.01" color="#4ecca3" scale="1 1 1" width="4.5"></a-text>
        <a-text value="B = {x | x > 0}  (set builder)" align="center" position="0 -1.05 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -1.45 0.01"></a-box>
        <a-text value="Empty set: {}" align="center" position="0 -1.9 0.01" color="white" scale="1 1 1" width="4.5"></a-text>
        <a-text value="|A| = cardinality (size of A)" align="center" position="0 -2.4 0.01" color="white" scale="1 1 1" width="4.5"></a-text>
      </a-entity>

      <!-- ===== UNION — angle -54 ===== -->
      <a-entity position="-9.7 3 -7" rotation="0 54 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Union  A U B" align="center" position="0 3.5 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <!-- Venn diagram -->
        <a-torus radius="0.8" radius-tubular="0.03" color="#4ecca3" position="-0.45 2.0 0.01"></a-torus>
        <a-torus radius="0.8" radius-tubular="0.03" color="#e94560" position="0.45 2.0 0.01"></a-torus>
        <a-plane width="0.55" height="1.3" color="#ff6b8a" opacity="0.3" position="0 2.0 0.005"></a-plane>
        <a-text value="A" align="center" position="-0.9 2.7 0.05" color="#4ecca3" scale="1.1 1.1 1.1"></a-text>
        <a-text value="B" align="center" position="0.9 2.7 0.05" color="#e94560" scale="1.1 1.1 1.1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.9 0.01"></a-box>
        <a-text value="A = {1, 2, 3}   B = {3, 4, 5}" align="center" position="0 0.45 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="A U B = {1, 2, 3, 4, 5}" align="center" position="0 -0.1 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.5 0.01"></a-box>
        <a-text value="Union contains ALL elements\nfrom BOTH sets.\nDuplicates are removed.\n\nx is in A U B if\nx is in A OR x is in B." align="center" position="0 -1.5 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== INTERSECTION — angle -18 ===== -->
      <a-entity position="-3.7 3 -11.4" rotation="0 18 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Intersection  A n B" align="center" position="0 3.5 0.01" color="#e94560" scale="1.3 1.3 1.3"></a-text>
        <!-- Venn diagram -->
        <a-torus radius="0.8" radius-tubular="0.03" color="#4ecca3" position="-0.45 2.0 0.01"></a-torus>
        <a-torus radius="0.8" radius-tubular="0.03" color="#e94560" position="0.45 2.0 0.01"></a-torus>
        <a-plane width="0.55" height="1.3" color="#4ecca3" opacity="0.5" position="0 2.0 0.005"></a-plane>
        <a-text value="A" align="center" position="-0.9 2.7 0.05" color="#4ecca3" scale="1.1 1.1 1.1"></a-text>
        <a-text value="B" align="center" position="0.9 2.7 0.05" color="#e94560" scale="1.1 1.1 1.1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.9 0.01"></a-box>
        <a-text value="A = {1, 2, 3}   B = {3, 4, 5}" align="center" position="0 0.45 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="A n B = {3}" align="center" position="0 -0.1 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.5 0.01"></a-box>
        <a-text value="Intersection contains only\nelements in BOTH sets.\n\nx is in A n B if\nx is in A AND x is in B.\n\nIf A n B = {} then\nA and B are disjoint." align="center" position="0 -1.8 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== COMPLEMENT — angle +18 ===== -->
      <a-entity position="3.7 3 -11.4" rotation="0 -18 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Complement  A'" align="center" position="0 3.5 0.01" color="#e94560" scale="1.5 1.5 1.5"></a-text>
        <!-- Visual: universal set with inner circle -->
        <a-plane width="2.8" height="2.0" color="#16213e" opacity="0.8" position="0 2.0 0.01"></a-plane>
        <a-torus radius="0.65" radius-tubular="0.03" color="#4ecca3" position="0 2.0 0.02"></a-torus>
        <a-text value="U" align="center" position="1.1 2.8 0.05" color="white" scale="0.9 0.9 0.9"></a-text>
        <a-text value="A" align="center" position="0 2.0 0.05" color="#4ecca3" scale="1 1 1"></a-text>
        <a-text value="A'" align="center" position="1.0 1.8 0.05" color="#e94560" scale="0.9 0.9 0.9"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.7 0.01"></a-box>
        <a-text value="U = {1,2,3,4,5}   A = {1, 2}" align="center" position="0 0.25 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="A' = {3, 4, 5}" align="center" position="0 -0.3 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.7 0.01"></a-box>
        <a-text value="Complement = all elements\nNOT in A, relative to U.\n\n(A')' = A\nA U A' = U\nA n A' = {}" align="center" position="0 -1.8 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
      </a-entity>

      <!-- ===== SUBSETS — angle +54 ===== -->
      <a-entity position="9.7 3 -7" rotation="0 -54 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Subsets" align="center" position="0 3.5 0.01" color="#e94560" scale="1.8 1.8 1.8"></a-text>
        <!-- Visual: nested circles -->
        <a-torus radius="1.1" radius-tubular="0.03" color="#4ecca3" position="0 2.0 0.01"></a-torus>
        <a-torus radius="0.6" radius-tubular="0.03" color="#e94560" position="0 2.0 0.01"></a-torus>
        <a-text value="B" align="center" position="0 2.0 0.05" color="#e94560" scale="1 1 1"></a-text>
        <a-text value="A" align="center" position="0.95 2.8 0.05" color="#4ecca3" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 0.6 0.01"></a-box>
        <a-text value="A = {1,2,3,4}   B = {2,3}" align="center" position="0 0.15 0.01" color="white" scale="0.95 0.95 0.95" width="4.5"></a-text>
        <a-text value="B is a subset of A" align="center" position="0 -0.4 0.01" color="#4ecca3" scale="1.05 1.05 1.05" width="4.5"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.8 0.01"></a-box>
        <a-text value="B is a subset of A if every\nelement of B is also in A.\n\nProper subset: B is a subset\nof A and B does not equal A.\n\nEvery set is a subset of itself.\n{} is a subset of every set." align="center" position="0 -2.1 0.01" color="white" scale="0.9 0.9 0.9" width="4.5"></a-text>
      </a-entity>

      <!-- ===== SET LAWS — angle +90 ===== -->
      <a-entity position="12 3 0" rotation="0 -90 0">
        <a-plane width="5" height="8" color="#0f3460" opacity="0.95"></a-plane>
        <a-text value="Set Laws" align="center" position="0 3.5 0.01" color="#e94560" scale="1.8 1.8 1.8"></a-text>
        <a-text value="De Morgan's Laws:" align="center" position="0 2.7 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="(A U B)' = A' n B'" align="center" position="0 2.2 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="(A n B)' = A' U B'" align="center" position="0 1.7 0.01" color="white" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 1.3 0.01"></a-box>
        <a-text value="Identity Laws:" align="center" position="0 0.9 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="A U {} = A" align="center" position="0 0.45 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="A n U = A" align="center" position="0 0.0 0.01" color="white" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -0.35 0.01"></a-box>
        <a-text value="Domination Laws:" align="center" position="0 -0.75 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="A U U = U" align="center" position="0 -1.2 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="A n {} = {}" align="center" position="0 -1.65 0.01" color="white" scale="1 1 1"></a-text>
        <a-box width="4.5" height="0.03" depth="0.01" color="#e94560" position="0 -2.05 0.01"></a-box>
        <a-text value="Idempotent Laws:" align="center" position="0 -2.45 0.01" color="#4ecca3" scale="1.05 1.05 1.05"></a-text>
        <a-text value="A U A = A" align="center" position="0 -2.9 0.01" color="white" scale="1 1 1"></a-text>
        <a-text value="A n A = A" align="center" position="0 -3.35 0.01" color="white" scale="1 1 1"></a-text>
      </a-entity>

    </a-scene>

    <!-- AI Tutor Overlay -->
    <div id="tutor-overlay">
      <h3>AI Tutor — Set Theory</h3>
      <div id="response-box">Ask me anything about set theory...</div>
      <input id="question-input" type="text" placeholder="e.g. What is a Cartesian product?" />
      <button id="ask-btn">Ask Phi-3</button>
    </div>

    <script>
      AFRAME.registerComponent('navigate-on-click', {
        schema: { url: { type: 'string' } },
        init: function () {
          this.el.addEventListener('click', () => {
            window.location.href = this.data.url;
          });
        }
      });

      document.getElementById('ask-btn').addEventListener('click', async () => {
        const input = document.getElementById('question-input');
        const responseBox = document.getElementById('response-box');
        const btn = document.getElementById('ask-btn');
        const question = input.value.trim();

        if (!question) return;

        btn.disabled = true;
        btn.textContent = 'Thinking...';
        responseBox.textContent = '';

        try {
          const res = await fetch('http://localhost:11434/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'phi3',
              prompt: 'You are a discrete mathematics tutor. Answer this question about Set Theory concisely: ' + question,
              stream: false
            })
          });

          const data = await res.json();
          responseBox.textContent = data.response;
        } catch (err) {
          responseBox.textContent = 'Error: Could not reach Ollama. Make sure it is running.';
        }

        btn.disabled = false;
        btn.textContent = 'Ask Phi-3';
        input.value = '';
      });
    </script>
  </body>
</html>
